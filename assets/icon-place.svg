<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- house body -->
  <rect x="12" y="22" width="24" height="18" rx="2" fill="#e8a0bf" fill-opacity="0.25" stroke="#e8a0bf" stroke-width="1.8" opacity="0.7"/>
  <!-- roof -->
  <path d="M8,24 L24,8 L40,24" fill="none" stroke="#8b6f5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <!-- door -->
  <rect x="20" y="30" width="8" height="10" rx="1" fill="#8b6f5c" fill-opacity="0.3" stroke="#8b6f5c" stroke-width="1.2" opacity="0.6"/>
  <!-- doorknob -->
  <circle cx="26" cy="36" r="1" fill="#8b6f5c" opacity="0.6"/>
  <!-- window -->
  <rect x="15" y="26" width="5" height="5" rx="0.8" fill="none" stroke="#8b6f5c" stroke-width="1.2" opacity="0.5"/>
  <!-- chimney -->
  <rect x="31" y="12" width="4" height="10" rx="0.5" fill="#e8a0bf" fill-opacity="0.2" stroke="#e8a0bf" stroke-width="1" opacity="0.5"/>
</svg>
